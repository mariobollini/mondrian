<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
               font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 9.5px; }
    </style>
  </defs>

  <!-- Mondrian black grid -->
  <rect width="880" height="480" fill="#111111"/>

  <!-- ── Panels ────────────────────────────────────────────────────── -->

  <!-- Waiting (left, full height) -->
  <rect x="8" y="8" width="508" height="464" fill="#15191E"/>

  <!-- Processing (top right) -->
  <rect x="524" y="8" width="348" height="232" fill="#2E3440"/>

  <!-- Blocked (bottom right) -->
  <rect x="524" y="248" width="348" height="224" fill="#762423"/>


  <!-- ── WAITING content ──────────────────────────────────────────── -->

