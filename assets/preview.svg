  <text x="170" y="272" class="mono" font-size="12.5" fill="#DCDCDC" opacity="0.5">    +28  −41</text>
  <text x="32" y="291" class="mono" font-size="12.5" fill="#5A8FC4">  src/session.ts</text>
  <text x="178" y="291" class="mono" font-size="12.5" fill="#DCDCDC" opacity="0.5">  +85   −0</text>

  <text x="32" y="330" class="mono" font-size="12.5" fill="#DCDCDC" opacity="0.45">Let me know if you'd like tests.</text>

  <!-- cursor -->
  <text x="32" y="370" class="mono" font-size="13" fill="#5A8FC4">$</text>
  <text x="46" y="370" class="mono" font-size="13" fill="#DCDCDC"> </text>
  <rect x="58" y="356" width="8" height="15" fill="#DCDCDC" opacity="0.8"/>

  <!-- wordmark bottom-left -->
  <text x="32" y="454" class="label" fill="#DCDCDC" opacity="0.18" font-size="11" letter-spacing="0.2em">mondrian</text>


