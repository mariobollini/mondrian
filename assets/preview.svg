  <text x="32" y="218" class="mono" font-size="12.5" fill="#DCDCDC">updated all call sites.</text>

  <!-- file summary -->
  <text x="32" y="253" class="mono" font-size="12.5" fill="#DCDCDC" opacity="0.55">Files changed:</text>
