  <text x="544" y="118" class="mono" font-size="12.5" fill="#5A8FC4">◆</text>
  <text x="562" y="118" class="mono" font-size="12.5" fill="#CDCECF"> Reading src/auth.ts</text>

  <text x="544" y="139" class="mono" font-size="12.5" fill="#5A8FC4">◆</text>
  <text x="562" y="139" class="mono" font-size="12.5" fill="#CDCECF"> Writing src/auth.test.ts</text>

  <!-- partial output -->
  <text x="544" y="176" class="mono" font-size="12" fill="#CDCECF" opacity="0.5">describe('auth', () => {</text>
  <text x="544" y="194" class="mono" font-size="12" fill="#CDCECF" opacity="0.5">  it('rejects bad token',</text>
  <text x="544" y="212" class="mono" font-size="12" fill="#CDCECF" opacity="0.35">    async () => {…</text>

  <!-- spinner -->
  <circle cx="844" cy="32" r="5" fill="none" stroke="#CDCECF" stroke-width="1.5" opacity="0.3"/>
  <path d="M 844 27 A 5 5 0 0 1 849 32" stroke="#CDCECF" stroke-width="1.5" fill="none" stroke-linecap="round"/>


  <!-- ── BLOCKED content ──────────────────────────────────────────── -->

  <text x="544" y="281" class="label" fill="#FFFFFF" opacity="0.35">Blocked</text>
  <line x1="544" y1="290" x2="856" y2="290" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>

  <!-- warning -->
  <text x="544" y="325" class="mono" font-size="13" fill="#FF9C44" font-weight="bold">⚠  Tool permission needed</text>

  <text x="544" y="358" class="mono" font-size="12.5" fill="#FFFFFF" opacity="0.65">Write to src/auth.test.ts</text>

  <!-- prompt line -->
  <text x="544" y="398" class="mono" font-size="12.5" fill="#FFFFFF">[y] Allow</text>
  <text x="648" y="398" class="mono" font-size="12.5" fill="#FFFFFF" opacity="0.5">  [n] Skip  [a] Always</text>

  <!-- cursor -->
  <rect x="544" y="418" width="8" height="15" fill="#FFFFFF" opacity="0.7"/>

</svg>
